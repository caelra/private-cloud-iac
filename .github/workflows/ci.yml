name: ci

# Offline checks only: no cloud credentials, no plan or apply.
# Production would add a plan/apply job that authenticates with GitHub OIDC.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init and validate
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for d in bootstrap envs/dev modules/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - name: Test (mocked providers)
        run: |
          for d in modules/network modules/dev_env modules/app_service envs/dev; do
            echo "::group::$d"
            terraform -chdir="$d" test
            echo "::endgroup::"
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lambda unit tests
        run: |
          pip install pytest
          python -m pytest -q
        working-directory: modules/app_build/lambda
      - name: Shell syntax
        run: bash -n scripts/validate.sh
